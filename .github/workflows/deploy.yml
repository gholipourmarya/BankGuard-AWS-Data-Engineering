name: Deploy ETL code

# Terraform owns the infrastructure (run `terraform apply` manually).
# Uploads an immutable script/library pair, then switches both URIs in one
# Glue UpdateJob call. Old releases remain available to already submitted jobs.
# Authentication uses OpenID Connect: no AWS access keys are stored in GitHub.

on:
  workflow_dispatch:
    inputs:
      run_job:
        description: "Start the Glue job after deploying"
        type: boolean
        default: false

permissions:
  id-token: write # required to request the OIDC token
  contents: read

concurrency:
  group: bankguard-code-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Repository variables (Settings > Secrets and variables > Actions > Variables):
    #   AWS_DEPLOY_ROLE_ARN  = terraform output github_deploy_role_arn
    #   AWS_REGION           = e.g. eu-central-1
    #   BANKGUARD_BUCKET     = terraform output bucket_name
    #   GLUE_JOB_NAME        = terraform output glue_job_name
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install "pytest>=8.0" -r requirements.txt
      - name: Run tests
        run: python -m pytest -q

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publish immutable ETL release
        env:
          BANKGUARD_BUCKET: ${{ vars.BANKGUARD_BUCKET }}
          GLUE_JOB_NAME: ${{ vars.GLUE_JOB_NAME }}
        run: python scripts/deploy_release.py "$BANKGUARD_BUCKET" "$GLUE_JOB_NAME"

      - name: Start Glue job
        if: ${{ inputs.run_job }}
        run: aws glue start-job-run --job-name "${{ vars.GLUE_JOB_NAME }}"
